apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-deployment
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: angular
  template:
    metadata:
      labels:
        app: angular
    spec:
      containers:
      - name: angular-container
        image: daneshkabade45/ecomm_store:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: angular-service
  namespace: frontend
spec:
  type: LoadBalancer
  selector:
    app: angular
  ports:
  - port: 80
    targetPort: 80
